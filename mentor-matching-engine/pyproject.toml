[project]
name = "mentor-matching-engine"
version = "0.1.0"
description = "Mentor-mentee matching engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pydantic>=2.13.4",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matching_engine"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]